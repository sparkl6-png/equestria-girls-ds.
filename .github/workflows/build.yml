name: Build Nintendo DS prototype

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:20241104
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify devkitPro tools
        run: |
          export DEVKITPRO=/opt/devkitpro
          test -d "$DEVKITPRO/libnds"
          command -v make
          command -v ndstool

      - name: Build .nds ROM
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM="$DEVKITPRO/devkitARM"
          make
          mkdir -p build
          find . -maxdepth 4 -type f -name '*.nds' ! -path './build/*' -exec cp {} build/equestria-girls-ds.nds \;
          test -s build/equestria-girls-ds.nds

      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: equestria-girls-ds-nds
          path: build/equestria-girls-ds.nds
          if-no-files-found: error
